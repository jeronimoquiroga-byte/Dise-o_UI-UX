<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 19 - Formulario Multi-step</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="form-container">
        <h1>Registro de Usuario</h1>
        
        <form>
            <!-- PASO 1: Datos Personales -->
            <div class="step step-1">
                <h2>Paso 1: Información Personal</h2>
                
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>

                <a href="#step-2" class="btn btn-next">Siguiente &rarr;</a>
            </div>

            <!-- PASO 2: Credenciales / Finalización -->
            <div class="step step-2" id="step-2">
                <h2>Paso 2: Seguridad</h2>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="botones-acciones">
                    <a href="#" class="btn btn-prev">&larr; Anterior</a>
                    <button type="submit" class="btn btn-submit">Registrarse</button>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
