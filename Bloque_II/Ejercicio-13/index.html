<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Formulario Estilizado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="contenedor-formulario">
        <h2>Contacto</h2>
        <p>Completa el formulario para enviarnos tu consulta.</p>

        <form action="#" method="POST">
            <div class="grupo-campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Perez" required>
            </div>

            <div class="grupo-campo">
                <label for="email">Correo electronico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="grupo-campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribi tu mensaje aqui..." required></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
    </main>

</body>
</html>
