<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galeria de Productos Flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="contenedor-principal">
        <h1>Galeria de Productos</h1>
        <p>Catalogo responsivo utilizando Flexbox, flex-wrap y flex-basis.</p>

        <div class="galeria">
            <!-- Tarjeta 1 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?random=1" alt="Producto 1">
                <div class="card-content">
                    <h3>Auriculares Inalambricos</h3>
                    <p class="precio">$45.000</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>

            <!-- Tarjeta 2 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?random=2" alt="Producto 2">
                <div class="card-content">
                    <h3>Teclado Mecanico</h3>
                    <p class="precio">$65.000</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>

            <!-- Tarjeta 3 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?random=3" alt="Producto 3">
                <div class="card-content">
                    <h3>Mouse Ergonomico</h3>
                    <p class="precio">$28.000</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>

            <!-- Tarjeta 4 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?random=4" alt="Producto 4">
                <div class="card-content">
                    <h3>Monitor 24" IPS</h3>
                    <p class="precio">$180.000</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>

            <!-- Tarjeta 5 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?random=5" alt="Producto 5">
                <div class="card-content">
                    <h3>Silla Gamer Pro</h3>
                    <p class="precio">$250.000</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>

            <!-- Tarjeta 6 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?random=6" alt="Producto 6">
                <div class="card-content">
                    <h3>Microfono USB</h3>
                    <p class="precio">$55.000</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
