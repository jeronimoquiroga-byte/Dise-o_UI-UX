<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Formulario de Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="contenedor-formulario">
        <h1>Contacto</h1>
        <p>Completa el formulario para ponerte en contacto con nosotros.</p>

        <form action="#" method="POST">
            <div class="grupo-formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Perez" required>
            </div>

            <div class="grupo-formulario">
                <label for="email">Correo electronico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="grupo-formulario">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribi tu mensaje aca..." required></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar mensaje</button>
        </form>
    </main>

</body>
</html>
